<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="xterm.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        #terminal-container {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            overflow: hidden;
        }
        .xterm {
            height: 100%;
        }
        .xterm-viewport {
            background-color: transparent !important;
            overflow-y: auto !important;
        }
        .xterm-viewport::-webkit-scrollbar {
            width: 6px;
        }
        .xterm-viewport::-webkit-scrollbar-track {
            background: transparent;
        }
        .xterm-viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        .xterm-viewport::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div id="terminal-container"></div>
    <script src="xterm.js"></script>
    <script src="xterm-addon-fit.js"></script>
    <script>
        var term = new Terminal({
            scrollback: 5000,
            theme: {
                background: '#00000000',
                foreground: '#F1F5F9',
                cursor: '#38BDF8',
                cursorAccent: '#000000',
                selectionBackground: 'rgba(56, 189, 248, 0.3)',
                black: '#1E293B',
                red: '#EF4444',
                green: '#10B981',
                yellow: '#F59E0B',
                blue: '#3B82F6',
                magenta: '#EC4899',
                cyan: '#06B6D4',
                white: '#F8FAFC',
                brightBlack: '#64748B',
                brightRed: '#F87171',
                brightGreen: '#34D399',
                brightYellow: '#FBBF24',
                brightBlue: '#60A5FA',
                brightMagenta: '#F472B6',
                brightCyan: '#22D3EE',
                brightWhite: '#FFFFFF'
            },
            fontFamily: '"MesloLGS NF", "SF Mono", Menlo, Monaco, "Cascadia Code", "Fira Code", "JetBrains Mono", monospace',
            fontSize: 12,
            lineHeight: 1.2,
            cursorBlink: true,
            cursorStyle: 'block',
            allowTransparency: true,
            macOptionIsMeta: true,
            rightClickSelectsWord: true
        });
        var fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));

        window.webkit.messageHandlers.terminal.postMessage({ type: "ready" });

        function doFit() {
            try {
                var el = document.getElementById('terminal-container');
                if (!el || el.clientWidth < 40 || el.clientHeight < 40) return;
                fitAddon.fit();
                term.focus();
                try { term.scrollToBottom(); } catch(e) {}
                if (term.cols > 0 && term.rows > 0) {
                    window.webkit.messageHandlers.terminal.postMessage({ type: "resize", cols: term.cols, rows: term.rows });
                }
            } catch(e) {}
        }

        doFit();
        setTimeout(doFit, 50);
        setTimeout(doFit, 150);
        setTimeout(doFit, 300);
        setTimeout(doFit, 600);

        const resizeObserver = new ResizeObserver(() => {
            doFit();
        });
        resizeObserver.observe(document.getElementById('terminal-container'));

        document.addEventListener('click', () => {
            term.focus();
        });

        term.onData(e => {
            window.webkit.messageHandlers.terminal.postMessage({ type: "data", data: e });
            try { term.scrollToBottom(); } catch(err) {}
        });

        function writeData(base64) {
            const wasAtBottom = term.buffer.active.viewportY === term.buffer.active.baseY;
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            term.write(bytes, () => {
                if (wasAtBottom) {
                    try { term.scrollToBottom(); } catch(e) {}
                }
            });
        }

        function clearTerminal() {
            term.clear();
        }
    </script>
</body>
</html>
